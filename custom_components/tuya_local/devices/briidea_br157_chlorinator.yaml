name: Salt chlorinator
products:
  - id: 6naoco5y58rhmbsu
    manufacturer: Briidea
    model: BR-157
    model_id: e1mtquyc

entities:
  - entity: binary_sensor
    name: Generating
    class: running
    dps:
      - id: 102
        name: sensor
        type: boolean

  - entity: sensor
    name: Salinity
    class: enum
    icon: "mdi:shaker-outline"
    dps:
      - id: 21
        name: sensor
        type: integer
        mapping:
          - dps_val: 0
            value: too_low
          - dps_val: 1
            value: low
          - dps_val: 2
            value: normal
          - dps_val: 3
            value: high

  - entity: sensor
    class: temperature
    icon: "mdi:pool-thermometer"
    dps:
      - id: 7
        name: sensor
        type: integer
        unit: C
        class: measurement

  - entity: sensor
    name: Water temperature F
    class: temperature
    category: diagnostic
    hidden: true
    dps:
      - id: 6
        name: sensor
        type: integer
        unit: F
        class: measurement

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 19
        name: sensor
        type: bitfield
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 19
        name: fault_code
        type: bitfield
      - id: 19
        name: description
        type: bitfield
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Temperature sensor short circuit
          - dps_val: 2
            value: Temperature sensor open circuit
          - dps_val: 3
            value: Temperature sensor short and open circuit

  - entity: switch
    name: Salinity detection
    icon: "mdi:shaker-outline"
    category: config
    dps:
      - id: 1
        name: switch
        type: boolean
        optional: true

  - entity: sensor
    name: Cumulative runtime
    class: duration
    category: diagnostic
    dps:
      - id: 27
        name: sensor
        type: integer
        unit: h
        class: total_increasing

  - entity: button
    name: Reset runtime
    category: config
    icon: "mdi:restart"
    dps:
      - id: 28
        name: button
        type: boolean

  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 24
        name: option
        type: string
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit

  - entity: number
    name: Working hours
    category: config
    icon: "mdi:timer-cog-outline"
    dps:
      - id: 101
        name: value
        type: integer
        unit: h
        range:
          min: 0
          max: 24

  - entity: number
    name: Start hour
    category: config
    icon: "mdi:clock-start"
    dps:
      - id: 103
        name: value
        type: integer
        unit: h
        range:
          min: 0
          max: 23

  - entity: number
    name: High salinity threshold
    category: config
    hidden: true
    dps:
      - id: 105
        name: value
        type: integer
        range:
          min: 0
          max: 4096

  - entity: number
    name: Mid salinity threshold
    category: config
    hidden: true
    dps:
      - id: 106
        name: value
        type: integer
        range:
          min: 0
          max: 4096

  - entity: number
    name: Low salinity threshold
    category: config
    hidden: true
    dps:
      - id: 107
        name: value
        type: integer
        range:
          min: 0
          max: 4096
